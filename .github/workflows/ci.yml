# Checks every pull request (once per push to it): database migration, seed, typecheck, lint, unit tests,
# production build, and a quick start of the built site. It never touches the VPS (deploy.yml does that,
# on main only). Pushes without a pull request are not checked automatically (Actions → CI → Run workflow
# checks any branch by hand), so each change uses its minutes once.
name: CI

on:
  pull_request:
  workflow_dispatch:

concurrency:
  # a newer push to the same pull request cancels the check still running for the older one
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: brightlink
          POSTGRES_PASSWORD: brightlink
          POSTGRES_DB: brightlink
        ports: ['5433:5432']
        options: >-
          --health-cmd "pg_isready -U brightlink" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://brightlink:brightlink@localhost:5433/brightlink?schema=public
      # Deliberately not the address the smoke test uses: proves the sitemap and canonicals come from SITE_URL.
      SITE_URL: https://www.brightlink.test
      R2_PUBLIC_HOSTNAME: media.example.com
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      # Each step keeps its output in a file and, if it fails, repeats the last lines as an error
      # annotation, so the reason is visible on the run page (and through the API) without opening logs.
      - name: Install
        run: npm ci > /tmp/out.txt 2>&1 || { tail -40 /tmp/out.txt | sed 's/^/::error title=Install::/'; exit 1; }

      - name: Apply migrations
        run: npx prisma migrate deploy > /tmp/out.txt 2>&1 || { tail -40 /tmp/out.txt | sed 's/^/::error title=Migrate::/'; exit 1; }

      - name: Seed (twice, must be safe to repeat)
        run: (npm run db:seed && npm run db:seed) > /tmp/out.txt 2>&1 || { tail -40 /tmp/out.txt | sed 's/^/::error title=Seed::/'; exit 1; }

      - name: Typecheck
        run: npm run typecheck > /tmp/out.txt 2>&1 || { tail -40 /tmp/out.txt | sed 's/^/::error title=Typecheck::/'; exit 1; }

      - name: Lint
        run: npx next lint > /tmp/out.txt 2>&1 || { grep -B2 "Error:" /tmp/out.txt | tail -40 | sed 's/^/::error title=Lint::/'; exit 1; }

      - name: Unit tests
        run: npm test > /tmp/out.txt 2>&1 || { tail -40 /tmp/out.txt | sed 's/^/::error title=Tests::/'; exit 1; }

      - name: Build
        run: npm run build > /tmp/out.txt 2>&1 || { tail -60 /tmp/out.txt | sed 's/^/::error title=Build::/'; exit 1; }

      - name: Start the built site and check key pages
        run: |
          cp -r public .next/standalone/ && cp -r .next/static .next/standalone/.next/
          PORT=3000 node .next/standalone/server.js > /tmp/server.txt 2>&1 &
          for i in $(seq 1 30); do curl -sf -o /dev/null http://localhost:3000/admin/login && break; sleep 1; done
          fail=0
          check() { code=$(curl -s -o /tmp/page.html -w '%{http_code}' "http://localhost:3000$1"); if [ "$code" != "$2" ]; then echo "::error title=Smoke::$1 returned $code, expected $2"; fail=1; fi; }
          check / 200
          check /about-us 200
          check /contact-us 200
          check /admin/login 200
          check /admin/settings 307
          check /admin/header 307
          check /admin/services 307
          check /admin/pages/home 307
          check /admin/blog 307
          check /blog/feed.xml 200
          check /admin/api/export/leads 401
          check /sitemap.xml 200
          check /our-services 200
          check /our-services/software-development 200
          check /our-services/not-a-service 404
          check /our-projects 200
          check /our-projects/stockpro 200
          check /our-projects/not-a-project 404
          check /blog 200
          # every page is drawn from its page-builder sections: the home page keeps the "#get-in-touch" anchor
          curl -s http://localhost:3000/ | grep -q 'id="get-in-touch"' || { echo "::error title=Smoke::home page has no #get-in-touch section"; fail=1; }
          # languages: French is off after the seed, so its pages send visitors to English; "/en/…" is not an address
          redir() { got=$(curl -s -o /dev/null -w '%{http_code} %{redirect_url}' "http://localhost:3000$1"); if [ "$got" != "$2 http://localhost:3000$3" ]; then echo "::error title=Smoke::$1 gave '$got', expected '$2 $3'"; fail=1; fi; }
          redir /fr/about-us 307 /about-us
          redir /en/about-us 308 /about-us
          redir /fr/admin 307 /admin
          # the home page must show the seeded company details and the chosen font variables
          curl -s http://localhost:3000/ | grep -q -- '--font-heading' || { echo "::error title=Smoke::home page has no --font-heading"; fail=1; }
          curl -s http://localhost:3000/ | grep -q 'info@brightlinkltd.com' || { echo "::error title=Smoke::home page lacks the seeded email"; fail=1; }
          # addresses for search engines must use SITE_URL, never localhost
          curl -s http://localhost:3000/sitemap.xml | grep -q '<loc>https://www.brightlink.test/about-us' || { echo "::error title=Smoke::sitemap does not use SITE_URL"; fail=1; }
          curl -s http://localhost:3000/robots.txt | grep -q 'Sitemap: https://www.brightlink.test/sitemap.xml' || { echo "::error title=Smoke::robots.txt does not use SITE_URL"; fail=1; }
          curl -s http://localhost:3000/about-us | grep -q 'rel="canonical" href="https://www.brightlink.test/about-us"' || { echo "::error title=Smoke::canonical does not use SITE_URL"; fail=1; }
          # articles show the safe HTML saved by the editor (tables, note boxes, code… are not converted away)
          curl -s http://localhost:3000/blog/stockpro-inventory-management-system | grep -q 'class="article-html"' || { echo "::error title=Smoke::article page does not render the saved HTML"; fail=1; }
          # the RSS feed must come from the database (seeded articles)
          curl -s http://localhost:3000/blog/feed.xml | grep -q 'StockPro' || { echo "::error title=Smoke::RSS feed lacks the seeded articles"; fail=1; }
          # the built site must read the database itself, never fall back to the starter content
          if grep -qE 'could not be loaded|ENOENT' /tmp/server.txt; then grep -m3 -A4 -E 'could not be loaded|ENOENT' /tmp/server.txt | sed 's/^/::error title=Database::/'; fail=1; fi
          if [ $fail = 1 ]; then tail -30 /tmp/server.txt | sed 's/^/::error title=Server log::/'; exit 1; fi
